<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run Page Final</title>
<meta name="description" content="Round 2: three layouts for the Earshot run page that combine the liked parts of options A and C, each shown mid-run and finished.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@400..600&family=Sora:wght@500..700&display=swap" rel="stylesheet">
<style>
/* Palette, type and motion copied from apps/web/src/home.css so the mockups match the landing page. */
:root {
  --bg: #0a0a0a; --surface: #121212; --surface-2: #181818; --line: #222; --line-strong: #2e2e2e;
  --text: #ededed; --text-2: #b4b4bb; --muted: #8b8b94; --accent: #f97316; --accent-hover: #fb8b3d; --accent-ink: #0a0a0a;
  --danger: #ff8a80; --ok: #7ee2a8; --sighted: #9db4d8;
  --sans: 'Inter', system-ui, sans-serif; --display: 'Sora', 'Inter', system-ui, sans-serif; --mono: 'JetBrains Mono', ui-monospace, monospace;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--bg); scrollbar-width: thin; scrollbar-color: var(--line-strong) var(--bg); }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
h1, h2, h3, p, ol, ul, figure, pre, dl, dd { margin: 0; }
ol, ul { padding: 0; list-style: none; }
button { font: inherit; color: inherit; }
::selection { background: var(--accent); color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
code, .mono { font-family: var(--mono); }
.ico { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.125em; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.see { color: var(--sighted); } .hear { color: var(--accent); }

/* ------------------------------------------------ chooser (not part of the app) */
.chooser { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 12px 24px; background: #1a120b; border-bottom: 1px solid #4a2a10; }
.chooser__title { font: 600 13px var(--display); color: #ffd7b8; }
.seg { display: inline-flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line-strong); }
.seg button { border: 0; background: transparent; min-height: 34px; padding: 0 14px; border-radius: 9px; color: var(--muted); font: 600 13px var(--display); cursor: pointer; transition: background-color 160ms var(--ease-out), color 160ms; }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--text); box-shadow: 0 0 0 1px var(--line-strong); }
.seg button b { color: var(--accent); margin-right: 6px; }
.chooser__note { margin-left: auto; color: #d9b89c; font-size: 12.5px; max-width: 52ch; }

body[data-state="live"] .when-done, body[data-state="done"] .when-live { display: none !important; }
.opt-intro { max-width: 1400px; margin: 0 auto; padding: 20px 24px 0; display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
.opt-intro h2 { font: 700 18px var(--display); letter-spacing: -0.02em; }
.opt-intro p { color: var(--muted); font-size: 13.5px; max-width: 90ch; }
.frame { max-width: 1400px; margin: 14px auto 64px; border: 1px solid var(--line-strong); border-radius: 16px; overflow: hidden; box-shadow: 0 40px 80px -40px rgb(0 0 0 / 0.9); background: var(--bg); }

/* ------------------------------------------------ shared app pieces */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px; padding: 0 16px; border: 1px solid transparent; border-radius: 999px; font: 600 13.5px/1 var(--display); letter-spacing: -0.01em; cursor: pointer; white-space: nowrap; text-decoration: none; transition: background-color 160ms var(--ease-out), border-color 160ms; }
.btn--primary { background: var(--accent); color: var(--accent-ink); } .btn--primary:hover { background: var(--accent-hover); }
.btn--ghost { background: var(--surface-2); border-color: var(--line-strong); color: var(--text); } .btn--ghost:hover { border-color: #3d3d3d; background: #1d1d1d; }
.btn--sm { min-height: 32px; padding: 0 12px; font-size: 12.5px; }

.apptop { display: flex; align-items: center; gap: 20px; height: 60px; padding: 0 24px; border-bottom: 1px solid var(--line); background: rgb(10 10 10 / 0.9); }
.brand { font: 700 22px/1 var(--display); letter-spacing: -0.03em; }
.brand span { color: var(--accent); }
.runname { display: flex; flex-direction: column; gap: 1px; padding-left: 20px; border-left: 1px solid var(--line); }
.runname b { font: 600 14px var(--display); }
.runname small { color: var(--muted); font-size: 12px; }
.apptop__right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.clock { font: 500 13px var(--mono); color: var(--text-2); font-variant-numeric: tabular-nums; }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line-strong); font-size: 12px; color: var(--text-2); white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
.dot--live { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.35; } }
.ok { color: var(--ok); } .bad { color: var(--danger); }

/* phase stepper */
.stepper { display: flex; align-items: center; gap: 0; }
.stepper li { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.stepper li + li::before { content: ""; width: 28px; height: 1px; margin: 0 10px; background: var(--line-strong); }
.stepper .n { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line-strong); font: 600 11px var(--mono); }
.stepper .done { color: var(--text-2); } .stepper .done .n { background: var(--surface-2); color: var(--ok); border-color: #2c4a38; }
.stepper .now { color: var(--text); font-weight: 600; } .stepper .now .n { border-color: var(--accent); background: #1a120b; color: var(--accent); }
.stepper .done.now::before, .stepper li.done + li::before { background: #3a3a3a; }

/* fake browser + store screenshot */
.browser { border-radius: 12px; overflow: hidden; border: 1px solid var(--line-strong); background: #f7f1e8; }
.browser__bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #1b1b1b; border-bottom: 1px solid var(--line); }
.browser__bar i { width: 9px; height: 9px; border-radius: 50%; background: #333; }
.browser__url { flex: 1; margin-left: 6px; padding: 4px 10px; border-radius: 6px; background: #0e0e0e; color: var(--muted); font: 400 11.5px var(--mono); }
.shop { padding: 18px 22px 22px; color: #3b2a1e; font-family: system-ui, sans-serif; }
.shop__nav { display: flex; justify-content: space-between; font-size: 12px; color: #6b5443; margin-bottom: 14px; }
.shop__nav b { font-size: 13px; color: #3b2a1e; }
.shop h4 { margin: 0 0 12px; font: 700 18px system-ui, sans-serif; }
.shop__grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
.fld { position: relative; margin-bottom: 9px; }
.fld label { display: block; font-size: 11px; color: #6b5443; margin-bottom: 3px; }
.fld div { height: 30px; padding: 0 10px; border: 1.5px solid #d9cbb6; border-radius: 7px; background: #fffaf3; font-size: 12.5px; line-height: 27px; }
.fld .som { top: 12px; }
.fld--active div { border-color: #2563eb; box-shadow: 0 0 0 3px rgb(37 99 235 / 0.18); }
.caret { display: inline-block; width: 1px; height: 14px; margin-left: 1px; background: #3b2a1e; vertical-align: -2px; animation: pulse 1s steps(1) infinite; }
.som { position: absolute; top: -8px; left: -8px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 5px; background: #2563eb; color: #fff; font: 600 10.5px/18px var(--mono); text-align: center; z-index: 1; }
.summary { padding: 12px; border-radius: 9px; background: #efe5d6; font-size: 12px; }
.summary p { display: flex; justify-content: space-between; margin-bottom: 5px; }
.summary .tot { border-top: 1px solid #d9cbb6; padding-top: 6px; font-weight: 700; }
.shop__btn { position: relative; margin-top: 10px; padding: 9px; border-radius: 8px; background: #3b2a1e; color: #fffaf3; text-align: center; font-size: 12.5px; font-weight: 600; }
.swatches { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
.sw { position: relative; padding: 9px; border: 1.5px solid #d9cbb6; border-radius: 9px; background: #fffaf3; color: #3b2a1e; font: 500 13px system-ui, sans-serif; text-align: center; }
.sw--pick { border-color: #3b2a1e; box-shadow: inset 0 0 0 1px #3b2a1e; background: #f0e2cf; }

/* screen-reader readout */
.reader { border-radius: 12px; border: 1px solid var(--line-strong); background: #070707; overflow: hidden; }
.reader__bar { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; }
.reader ol { padding: 10px 0; }
.reader li { display: flex; justify-content: space-between; gap: 16px; padding: 4px 14px; font: 400 12.5px/1.6 var(--mono); color: var(--text-2); }
.reader li span { color: var(--danger); font-family: var(--sans); font-size: 12px; white-space: nowrap; }
.reader li.focus { background: rgb(249 115 22 / 0.09); color: var(--text); box-shadow: inset 2px 0 0 var(--accent); }
.reader li.dim { color: #6b6b73; }

/* checkpoint track */
.track { display: flex; justify-content: space-between; position: relative; padding-bottom: 2px; }
.track::before { content: ""; position: absolute; left: 7px; right: 7px; top: 6px; height: 1px; background: var(--line-strong); }
.track .fill { position: absolute; left: 7px; top: 5.5px; height: 2px; background: currentColor; border-radius: 2px; }
.track li { position: relative; flex: 0 0 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); white-space: nowrap; }
.track li:first-of-type { align-items: flex-start; }
.track li:last-child { align-items: flex-end; }
.track i { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--line-strong); background: var(--bg); position: relative; z-index: 1; }
.track .hit i { background: currentColor; border-color: currentColor; }
.track .hit { color: inherit; }
.track .hit em { color: var(--text-2); }
.track em { font-style: normal; }
.track .here i { box-shadow: 0 0 0 4px rgb(249 115 22 / 0.18); border-color: currentColor; }
.track .stuck i { border-color: var(--danger); background: #2a1210; display: grid; place-items: center; }
.track .stuck i::after { content: ""; width: 6px; height: 1.5px; background: var(--danger); transform: rotate(45deg); box-shadow: 0 0 0 0 var(--danger); }
.track .stuck em { color: var(--danger); font-weight: 600; }

/* diff */
.diff { border-radius: 10px; border: 1px solid var(--line-strong); background: #070707; padding: 10px 0; font: 400 12.5px/1.7 var(--mono); overflow-x: auto; }
.diff div { padding: 0 14px; white-space: pre; }
.diff .rm { background: rgb(255 138 128 / 0.08); color: #ffb4ab; }
.diff .add { background: rgb(126 226 168 / 0.08); color: #b5f0cd; }
.diff ins { text-decoration: none; background: rgb(126 226 168 / 0.18); border-radius: 3px; }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; border: 1px solid var(--line-strong); color: var(--text-2); white-space: nowrap; }
.tag--bad { color: #ffc7c1; border-color: rgb(255 138 128 / 0.35); background: rgb(255 138 128 / 0.07); }
.tag--ok { color: #bff3d4; border-color: rgb(126 226 168 / 0.35); background: rgb(126 226 168 / 0.07); }
.tag--accent { color: #ffd7b8; border-color: rgb(249 115 22 / 0.4); background: #1a120b; }

.h { font: 600 15px/1.3 var(--display); letter-spacing: -0.015em; }
.sub { color: var(--muted); font-size: 13px; }
.why { color: var(--text-2); font-size: 13.5px; }
.why b { color: var(--text); font-weight: 600; }

/* ================================================ OPTION A: split screens */
.a-strip { display: flex; align-items: center; gap: 18px; padding: 10px 24px; border-bottom: 1px solid var(--line); background: #0d0d0d; font-size: 12.5px; color: var(--text-2); flex-wrap: wrap; }
.a-strip .ico { color: var(--muted); }
.a-strip > span { display: inline-flex; align-items: center; gap: 7px; }
.a-strip .sep { width: 1px; height: 14px; background: var(--line-strong); }
.a-strip button { margin-left: auto; background: none; border: 0; color: var(--text); font-size: 12.5px; cursor: pointer; text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 4px; }
.a-sub { display: flex; align-items: center; gap: 20px; padding: 14px 24px; border-bottom: 1px solid var(--line); }
.a-sub p { color: var(--text-2); font-size: 13.5px; }
.a-sub p b { color: var(--text); }
.a-sub .how { margin-left: auto; color: var(--muted); font-size: 12.5px; display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.a-main { padding: 22px 24px 28px; }
.a-screens { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.a-screen { display: flex; flex-direction: column; gap: 14px; padding: 16px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); }
.a-screen--stuck { border-color: rgb(255 138 128 / 0.32); box-shadow: 0 0 0 1px rgb(255 138 128 / 0.08), 0 30px 60px -40px rgb(255 138 128 / 0.35); }
.a-screen__head { display: flex; align-items: center; gap: 10px; }
.a-screen__head .who { display: inline-flex; align-items: center; gap: 8px; font: 600 15px var(--display); }
.a-screen__head .tag { margin-left: auto; }
.a-screen .browser, .a-screen .reader { min-height: 300px; }
.a-screen .reader { display: flex; flex-direction: column; }
.a-act { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); }
.a-act .step { flex: none; font: 600 11.5px var(--mono); color: var(--muted); padding-top: 2px; }
.a-act p:first-of-type { font-weight: 600; font-size: 13.5px; }
.ticks { display: flex; align-items: center; gap: 5px; }
.ticks button { width: 18px; height: 22px; padding: 0; border: 0; background: none; cursor: pointer; display: grid; place-items: center; }
.ticks button::before { content: ""; width: 4px; height: 14px; border-radius: 2px; background: var(--line-strong); transition: height 160ms var(--ease-out), background-color 160ms; }
.ticks button:hover::before { background: var(--text-2); height: 18px; }
.ticks .ms::before { background: var(--text-2); }
.ticks .cur::before { background: var(--accent); height: 20px; }
.ticks .x::before { background: var(--danger); }
.ticks .empty::before { background: #1a1a1a; }
.ticks__label { margin-left: 8px; color: var(--muted); font: 500 11.5px var(--mono); }
.ticks__live { margin-left: auto; display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--text-2); }
.a-split { margin-top: 20px; display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center; padding: 16px 20px; border-radius: 16px; border: 1px solid rgb(255 138 128 / 0.28); background: linear-gradient(90deg, rgb(255 138 128 / 0.07), transparent 60%); }
.a-split__icon { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: #2a1210; color: var(--danger); font-size: 20px; }
.a-split p:first-child { font: 600 15px var(--display); }
.a-alert { display: flex; align-items: center; gap: 12px; padding: 10px 24px; background: #160d0c; border-bottom: 1px solid rgb(255 138 128 / 0.35); font-size: 13px; color: #ffd1cb; }
.a-alert .ico { color: var(--danger); font-size: 17px; }
.a-alert code { color: #ffc7c1; font-size: 12px; }
.a-alert .btn { margin-left: auto; }
.toast { position: absolute; right: 24px; bottom: 24px; width: 380px; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; padding: 14px 16px; border-radius: 14px; background: #160d0c; border: 1px solid rgb(255 138 128 / 0.4); box-shadow: 0 24px 48px -16px rgb(0 0 0 / 0.9); font-size: 13px; }
.toast .ico { grid-row: span 3; color: var(--danger); font-size: 20px; margin-top: 2px; }
.toast b { font: 600 13.5px var(--display); }
.toast code { color: #ffc7c1; font-size: 12px; }
.toast small { color: var(--muted); }
.rel { position: relative; }

/* A finished */
.verdict { padding: 36px 24px 28px; border-bottom: 1px solid var(--line); background: radial-gradient(60% 120% at 0% 0%, rgb(249 115 22 / 0.1), transparent 60%); }
.verdict__row { display: flex; gap: 32px; align-items: flex-end; flex-wrap: wrap; }
.verdict h1 { max-width: 24ch; font: 700 clamp(26px, 3vw, 38px)/1.1 var(--display); letter-spacing: -0.03em; text-wrap: balance; }
.verdict h1 em { font-style: normal; color: var(--ok); }
.verdict p { margin-top: 12px; color: var(--text-2); max-width: 62ch; }
.verdict__facts { margin-left: auto; display: flex; gap: 28px; }
.verdict__facts div { display: flex; flex-direction: column; }
.verdict__facts dt { color: var(--muted); font-size: 12px; }
.verdict__facts dd { font: 600 20px var(--display); letter-spacing: -0.02em; }
.a-done { padding: 24px; display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; }
.card { padding: 20px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); }
.card + .card { margin-top: 0; }
.finding__head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.finding h3 { margin-top: 12px; font: 700 20px/1.25 var(--display); letter-spacing: -0.02em; }
.finding__cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 18px; }
.finding__cols .lbl, .lbl { display: block; color: var(--muted); font-size: 12px; margin-bottom: 8px; }
.finding__foot { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.mini-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.cmp { display: grid; gap: 18px; }
.cmp__row { display: grid; grid-template-columns: 120px 1fr; gap: 14px; align-items: start; }
.cmp__row > span { display: inline-flex; gap: 7px; align-items: center; font-size: 12.5px; font-weight: 600; padding-top: 0; }
.safe-list { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; margin-top: 14px; }
.safe-list div { display: flex; flex-direction: column; gap: 2px; }
.safe-list dt { color: var(--muted); font-size: 12px; }
.safe-list dd { font-size: 14px; font-weight: 600; }

/* ================================================ OPTION C: guided stages + live map */
.c-body { display: grid; grid-template-columns: 270px minmax(0, 1fr) 330px; min-height: 760px; }
.c-rail { padding: 22px 20px; border-right: 1px solid var(--line); background: #0c0c0c; }
.c-rail h2 { font: 600 12px var(--sans); color: var(--muted); margin-bottom: 14px; }
.stages { position: relative; }
.stages li { position: relative; display: grid; grid-template-columns: 28px 1fr; gap: 12px; padding-bottom: 20px; }
.stages li:not(:last-child)::after { content: ""; position: absolute; left: 13.5px; top: 30px; bottom: 2px; width: 1px; background: var(--line-strong); }
.stages li.done:not(:last-child)::after { background: #2c4a38; }
.stages .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line-strong); color: var(--muted); font: 600 12px var(--mono); background: var(--bg); }
.stages .done .n { color: var(--ok); border-color: #2c4a38; background: #0f1a14; }
.stages .now .n { color: var(--accent); border-color: var(--accent); background: #1a120b; box-shadow: 0 0 0 5px rgb(249 115 22 / 0.12); }
.stages h3 { font: 600 14px/28px var(--display); color: var(--muted); }
.stages .done h3 { color: var(--text-2); }
.stages .now h3 { color: var(--text); }
.stages p { margin-top: 2px; color: var(--text-2); font-size: 13px; }
.stages .now p { color: var(--text); }
.stages .later p { color: var(--muted); }
.stages .meter { margin-top: 10px; height: 4px; border-radius: 4px; background: var(--line-strong); overflow: hidden; }
.stages .meter span { display: block; height: 100%; width: 42%; background: var(--accent); }
.c-stage { padding: 22px 24px 28px; min-width: 0; }
.c-stage__head h1 { font: 700 26px/1.15 var(--display); letter-spacing: -0.03em; max-width: 26ch; text-wrap: balance; }
.c-stage__head p { margin-top: 8px; color: var(--text-2); max-width: 64ch; }
.moment { margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; border-radius: 18px; overflow: hidden; border: 1px solid var(--line-strong); }
.moment > div { padding: 18px; display: flex; flex-direction: column; gap: 12px; background: var(--surface); }
.moment > div + div { border-left: 1px solid var(--line-strong); background: #0c0c0c; }
.moment__who { display: flex; align-items: center; gap: 8px; font: 600 14px var(--display); }
.moment__who .tag { margin-left: auto; }
.moment__said { font-size: 13.5px; color: var(--text-2); }
.moment__said b { color: var(--text); }
.moment__foot { grid-column: 1 / -1; padding: 14px 18px !important; flex-direction: row !important; align-items: center; gap: 14px !important; background: #160d0c !important; border-top: 1px solid rgb(255 138 128 / 0.3); border-left: 0 !important; }
.moment__foot p { font-size: 13.5px; color: #ffd1cb; }

.flow__link { display: flex; flex-direction: column; justify-content: center; gap: 5px; padding: 0 10px; text-align: center; }

.flow__line { position: relative; display: block; height: 1px; background: var(--line-strong); }
.flow__line::after { content: ""; position: absolute; right: -1px; top: -3px; border: 3.5px solid transparent; border-left: 5px solid #4a4a4a; border-right: 0; }

.pkt--late { animation-delay: 1.2s; }
@keyframes travel { 0% { left: 0; opacity: 0; } 12% { opacity: 1; } 80% { opacity: 1; } 100% { left: calc(100% - 6px); opacity: 0; } }

<script>
  // Stamp the shared templates into place, so every option uses identical content.
  let slot;
  while ((slot = document.querySelector('[data-use]'))) {
    slot.replaceWith(document.getElementById(slot.dataset.use).content.cloneNode(true));
  }
  const body = document.body;
  document.querySelectorAll('.chooser button').forEach((b) => b.addEventListener('click', () => {
    const key = b.dataset.opt ? 'opt' : 'state';
    body.dataset[key] = b.dataset[key];
    b.parentElement.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    window.scrollTo({ top: 0 });
  }));
</script>
